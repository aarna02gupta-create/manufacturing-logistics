name: Validate logistics project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate CSV datasets
        run: python src/pipeline.py --validate-only

      # check_rollback.py requires local MySQL and is deliberately excluded.
      - name: Run database-independent tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
